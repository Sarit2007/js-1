<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>תרגיל JavaScript 1 - חלק א'</title>
  <script>
    // א3
    // השערות לפני הרצה:
    // 5 == "5" -> true, 5 === "5" -> false, 0 == false -> true, 0 === false -> false
    // null == undefined -> true, null === undefined -> false, NaN === NaN -> false, "a" === "a" -> true
    console.log(5 == "5");
    console.log(5 === "5");
    console.log(0 == false);
    console.log(0 === false);
    console.log(null == undefined);
    console.log(null === undefined);
    console.log(NaN === NaN);
    console.log("a" === "a");

    console.log(Boolean(0));
    console.log(Boolean("false"));
    console.log(Boolean(null));
    console.log(Boolean(undefined));
    console.log(Boolean([]));
    console.log(Boolean("0"));
    console.log(Boolean(-1));

    // עדיף להשתמש ב-=== כי הוא בודק שוויון ללא המרת טיפוסים אוטומטית ומונע באגים מפתיעים.
  </script>
</head>
<body>
  <h1>חלק א'</h1>
  <p>פתחי את הקונסולה (F12) כדי לראות את התוצאות.</p>
</body>
</html>
