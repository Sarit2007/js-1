<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>תרגיל JavaScript 1 - חלק א'</title>
  <script>
    // א2
    // השערות לפני הרצה:
    // 42 -> "number", 3.14 -> "number", "שלום" -> "string", null -> "object", undefined -> "undefined", true -> "boolean"
    console.log(typeof 42);
    console.log(typeof 3.14);
    console.log(typeof "שלום");
    console.log(typeof null);
    console.log(typeof undefined);
    console.log(typeof true);

    // השערות המרות:
    // "5" + 3 -> "53", "5" - 3 -> 2, "5" * "2" -> 10, 7 / 2 - 1 -> 2.5
    console.log("5" + 3);
    console.log("5" - 3);
    console.log("5" * "2");
    console.log(7 / 2 - 1);
  </script>
</head>
<body>
  <h1>חלק א'</h1>
  <p>פתחי את הקונסולה (F12) כדי לראות את התוצאות.</p>
</body>
</html>
